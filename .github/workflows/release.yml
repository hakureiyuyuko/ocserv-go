name: release

# 推 v* 标签 = 自动出包并挂到 Release；也可以手动触发（只产出 artifact，不发 Release）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，需与 ocserv-go/install.sh 的 VERSION 一致）'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建发行包（amd64 / arm64）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V='${{ inputs.version }}'
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          grep -q "^VERSION=\"$V\"" ocserv-go/install.sh \
            || { echo "ocserv-go/install.sh 的 VERSION 不是 $V"; exit 1; }
          grep -q "const version = \"$V\"" ocserv-go/main.go \
            || { echo "main.go 的 version 不是 $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本: $V"

      - uses: actions/setup-go@v5
        with:
          go-version-file: ocserv-go/go.mod

      - name: 检查内嵌前端
        run: |
          set -euo pipefail
          [ -s ocserv-go/panel/webdist/index.html ] || {
            echo "缺少 ocserv-go/panel/webdist（面板前端未构建/未入库）"; exit 1; }
          ls -l ocserv-go/panel/webdist ocserv-go/panel/webdist/assets

      - name: 单元测试
        run: cd ocserv-go && go test ./...

      - name: 构建 ocserv-go 发行包（amd64 / arm64）
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.version }}'
          mkdir -p dist/pkg
          for ARCH in amd64 arm64; do
            D="$GITHUB_WORKSPACE/dist/pkg/ocserv-go-${V}-linux-${ARCH}"
            mkdir -p "$D/bin"
            ( cd ocserv-go && GOOS=linux GOARCH="$ARCH" CGO_ENABLED=0 \
                go build -trimpath -ldflags "-s -w" -o "$D/bin/ocserv-go" . )
            [ -s "$D/bin/ocserv-go" ] || { echo "构建产物缺失: $D/bin/ocserv-go"; exit 1; }
            cp ocserv-go/install.sh "$D/install.sh"
            chmod +x "$D/install.sh"
            cp LICENSE "$D/LICENSE"
            cp ocserv-go/README.md "$D/README.md" 2>/dev/null || cp README.md "$D/README.md"
            tar czf "dist/ocserv-go-${V}-linux-${ARCH}.tar.gz" -C dist/pkg "ocserv-go-${V}-linux-${ARCH}"
            tar tzf "dist/ocserv-go-${V}-linux-${ARCH}.tar.gz" > /tmp/pkglist.txt
            grep -q "bin/ocserv-go" /tmp/pkglist.txt || { echo "包内没有 bin/ocserv-go"; exit 1; }
          done
          rm -rf dist/pkg
          ls -l dist

      - name: 冒烟测试（本地架构可执行 + 元数据自检）
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.version }}'
          rm -rf /tmp/smk && mkdir -p /tmp/smk && cd /tmp/smk
          tar xzf "$GITHUB_WORKSPACE/dist/ocserv-go-${V}-linux-amd64.tar.gz"
          P="ocserv-go-${V}-linux-amd64"
          "$P/bin/ocserv-go" -version | tee /tmp/smk/ver.txt
          grep -qx "$V" /tmp/smk/ver.txt || { echo "二进制版本不是 $V"; exit 1; }
          sh -n "$P/install.sh"
          grep -q 'ocserv-go' "$P/install.sh"

      - name: 生成校验和
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocserv-go-${{ steps.ver.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: 查找手写 Release 说明
        id: notes
        run: |
          F=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$F" ]; then echo "path=$F" >> "$GITHUB_OUTPUT"; echo "使用 $F"; fi

      - name: 发布到 Release（手写说明）
        if: startsWith(github.ref, 'refs/tags/') && steps.notes.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true

      - name: 发布到 Release（自动生成说明）
        if: startsWith(github.ref, 'refs/tags/') && steps.notes.outputs.path == ''
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
