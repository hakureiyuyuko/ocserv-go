name: release

# 推 v* 标签 = 自动出包并挂到 Release；也可以手动触发（只产出 artifact，不发 Release）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，需与 install.sh 的 KIT_VERSION 一致）'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建发行包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号并识别产品线
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V='${{ inputs.version }}'
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          # v1.6.x 属于主线套件（install.sh KIT_VERSION），v1.0.0 属于 ocserv-go 分支
          KIND=""
          if grep -q "KIT_VERSION=\"$V\"" install.sh; then
            KIND=kit
          elif [ -f ocserv-go/install.sh ] && grep -q "^VERSION=\"$V\"" ocserv-go/install.sh; then
            KIND=go
          fi
          if [ -z "$KIND" ]; then
            echo "版本 $V 与 install.sh 的 KIT_VERSION、ocserv-go/install.sh 的 VERSION 都不匹配"
            exit 1
          fi
          if [ "$KIND" = "kit" ]; then
            grep -q "VERSION *= *'$V'" ocserv-panel/server.js || { echo "server.js 的 VERSION 不是 $V"; exit 1; }
            [ -x alpine/install.sh ] || chmod +x alpine/install.sh
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "版本: $V   产品线: $KIND"

      - name: 构建 Alpine 包（自编译 ocserv + 内置 Node）
        if: steps.ver.outputs.kind == 'kit'
        run: bash alpine/build-package.sh --version '${{ steps.ver.outputs.version }}' --out dist

      - name: 构建主线包（不含 docs/ 与 tools/）
        if: steps.ver.outputs.kind == 'kit'
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.version }}'
          mkdir -p dist/kit/ocserv-deploy-kit
          git ls-files | grep -vE '^(\.github/|docs/|tools/)' | tar -cf - -T - | tar -xf - -C dist/kit/ocserv-deploy-kit
          tar czf "dist/ocserv-deploy-kit-${V}.tar.gz" -C dist/kit ocserv-deploy-kit
          rm -rf dist/kit

      - name: 冒烟测试（Alpine 包能装能跑）
        if: steps.ver.outputs.kind == 'kit'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/d:ro" alpine:latest sh -c '
            mkdir -p /tmp/t && cd /tmp/t && tar xzf /d/ocserv-deploy-kit-alpine-*.tar.gz
            P=$(ls -d ocserv-deploy-kit-alpine-*/ | head -1)
            "$P/bin/ocserv" --version | head -1
            "$P/bin/node" -v
            sh -n "$P/install.sh"
            [ -x "$P/bin/ocserv.real-worker" ] && echo "worker: ok"
            ls "$P/lib" | wc -l
          '

      - uses: actions/setup-go@v5
        if: steps.ver.outputs.kind == 'go'
        with:
          go-version-file: ocserv-go/go.mod

      - name: 构建 ocserv-go 发行包（amd64 / arm64）
        if: steps.ver.outputs.kind == 'go'
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.version }}'
          mkdir -p dist/pkg
          for ARCH in amd64 arm64; do
            D="dist/pkg/ocserv-go-${V}-linux-${ARCH}"
            mkdir -p "$D/bin"
            ( cd ocserv-go && GOOS=linux GOARCH="$ARCH" CGO_ENABLED=0 \
                go build -trimpath -ldflags "-s -w" -o "../../$D/bin/ocserv-go" . )
            cp ocserv-go/install.sh "$D/install.sh"
            chmod +x "$D/install.sh"
            cp LICENSE "$D/LICENSE"
            cp ocserv-go/README.md "$D/README.md" 2>/dev/null || cp README.md "$D/README.md"
            tar czf "dist/ocserv-go-${V}-linux-${ARCH}.tar.gz" -C dist/pkg "ocserv-go-${V}-linux-${ARCH}"
          done
          rm -rf dist/pkg
          ls -l dist

      - name: 冒烟测试（ocserv-go：本地架构可执行 + 元数据自检）
        if: steps.ver.outputs.kind == 'go'
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.version }}'
          rm -rf /tmp/smk && mkdir -p /tmp/smk && cd /tmp/smk
          tar xzf "$GITHUB_WORKSPACE/dist/ocserv-go-${V}-linux-amd64.tar.gz"
          P="ocserv-go-${V}-linux-amd64"
          "$P/bin/ocserv-go" -version | tee /tmp/smk/ver.txt
          grep -qx "$V" /tmp/smk/ver.txt || { echo "二进制版本不是 $V"; exit 1; }
          sh -n "$P/install.sh"
          grep -q 'ocserv-go' "$P/install.sh"

      - name: 生成校验和
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocserv-deploy-kit-${{ steps.ver.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: 查找手写 Release 说明
        id: notes
        run: |
          F=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$F" ]; then echo "path=$F" >> "$GITHUB_OUTPUT"; echo "使用 $F"; fi

      - name: 发布到 Release（手写说明）
        if: startsWith(github.ref, 'refs/tags/') && steps.notes.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true

      - name: 发布到 Release（自动生成说明）
        if: startsWith(github.ref, 'refs/tags/') && steps.notes.outputs.path == ''
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
