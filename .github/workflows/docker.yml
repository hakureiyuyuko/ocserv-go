name: docker

# 推 v* 标签时自动构建多架构镜像并推到 GHCR（ghcr.io/<owner>/ocserv-go）。
# 手工触发只构建、检查是否可构建（不推 latest 之外的标签）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查内嵌前端
        run: |
          set -euo pipefail
          [ -s ocserv-go/panel/webdist/index.html ] || {
            echo "缺少 ocserv-go/panel/webdist（面板前端未构建/未入库）"; exit 1; }
          ls -l ocserv-go/panel/webdist ocserv-go/panel/webdist/assets

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析版本号
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="dev-$(echo "${GITHUB_SHA}" | cut -c1-8)"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: 构建并推送（amd64 / arm64）
        uses: docker/build-push-action@v6
        with:
          context: ./ocserv-go
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
